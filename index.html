<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cobertura Bethesda 3D</title>
<meta name="theme-color" content="#00a1ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Comfortaa:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D viewport, floating spec panel on the left (bottom sheet on phones) */
:root{
  --bg:#eef2f5; --sky:#e8edf1; --panel:#ffffffef; --fg:#0d1014; --muted:#5a6672; --line:#d6dde3;
  --brand:#00a1ff; --brand-ink:#0077c2; --accent:#00a1ff; --chip:#f2f5f8;
  --f-display:"Comfortaa","Montserrat",system-ui,sans-serif; --f-body:"Montserrat",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:300px;max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;overflow:hidden;z-index:5}
.head{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.head .t{flex:1;min-width:0}
.eyebrow{font:600 10.5px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 19px/1.2 var(--f-display);margin:6px 0 4px;text-wrap:balance;letter-spacing:-.01em}
.logo{display:block;height:26px;width:auto;color:var(--fg);margin:0 0 14px}
.logo path{fill:currentColor}
.logo path.b{fill:var(--brand)}
#loader .logo{height:34px;margin:0 auto 18px}
.head{border-top:3px solid var(--brand)}
.eyebrow{color:var(--brand-ink)!important}
label.cat input:checked{accent-color:var(--brand)}
button.v.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sub{font-size:12.5px;color:var(--muted)}
#toggle{display:none;background:var(--chip);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 10px;font:500 12px var(--f-body);cursor:pointer}
.body{overflow:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:16px}
.sec h2{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.views{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button.v{background:var(--chip);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:7px 0;font:500 12px var(--f-body);cursor:pointer}
button.v:hover,#toggle:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,label.cat:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.cats{display:flex;flex-direction:column;gap:6px}
details.area{border:1px solid var(--line);border-radius:8px;padding:2px 4px 4px}
details.area summary{display:grid;grid-template-columns:auto 1fr auto auto;gap:9px;align-items:center;padding:7px 6px;cursor:pointer;font-weight:600;font-size:13px;list-style:none}
details.area summary::-webkit-details-marker{display:none}
details.area summary::after{content:"▾";color:var(--muted);font-size:11px;transition:transform .15s}
details.area:not([open]) summary::after{transform:rotate(-90deg)}
details.area summary input{margin:0;accent-color:var(--brand)}
details.area label.cat{padding-left:22px}
label.cat{display:grid;grid-template-columns:auto 14px 1fr auto;gap:9px;align-items:center;padding:6px 6px;border-radius:6px;cursor:pointer;font-size:13px}
label.cat:hover{background:var(--chip)}
label.cat input{margin:0;accent-color:var(--accent)}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid #0003}
.n{font:400 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;font-size:12.5px}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.mini{display:flex;gap:6px}
.mini button{flex:1}
#info{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;z-index:5;max-width:260px}
#info b{display:block;font-weight:600;margin-bottom:2px}
#info span{color:var(--muted);font:400 11.5px var(--f-mono)}
#loader{position:fixed;inset:0;display:grid;place-items:center;z-index:10;background:var(--bg)}
#loader .box{width:min(320px,80vw);text-align:center;display:flex;flex-direction:column;gap:10px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#loader small{font:400 12px var(--f-mono);color:var(--muted)}
.hint{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));font:400 11.5px var(--f-mono);color:var(--muted);z-index:4;text-align:right}
@media (max-width:700px){
  .panel{top:auto;bottom:0;left:0;right:0;width:auto;border-radius:12px 12px 0 0;max-height:60%;padding-bottom:env(safe-area-inset-bottom,0px)}
  .head{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .panel.closed .body{display:none}
  #toggle{display:block}
  .panel .logo{height:20px;margin-bottom:8px}
  h1{font-size:16px;margin:4px 0 0}
  .panel.closed .sub{display:none}
  .head{padding-top:12px;padding-bottom:10px}
  .hint{display:none}
  #info{left:max(16px,env(safe-area-inset-left,0px));right:auto}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setIndex(new THREE.BufferAttribute(idx,1));
    g.computeBoundingSphere();
    const c=catOf(h.name), ar=areaOf(h.name), m=new THREE.Mesh(g,mats[c.id]); m.userData={layer:h.name,cat:c,area:ar};
    ((groups[ar.id]??={})[c.id]??=[]).push(m); root.add(m);
  }
  scene.add(root);
  box.setFromObject(root); box.getSize(size); box.getCenter(center);
  const grid=new THREE.GridHelper(Math.ceil(Math.max(size.x,size.z)*1.4),Math.ceil(Math.max(size.x,size.z)*1.4/5),0x888888,0x888888);
  grid.material.transparent=true; grid.material.opacity=0.18; grid.position.set(center.x,box.min.y-0.01,center.z); scene.add(grid);
  buildLegend(); setView('iso',false);
  document.getElementById('loader').hidden=true;
}
loadModel().catch(err=>{progt.textContent='Não foi possível carregar o modelo. Recarregue a página.';console.error(err);});

function buildLegend(){
  const el=document.getElementById('cats');
  for(const ar of AREAS){
    const gs=groups[ar.id]; if(!gs)continue;
    const box=document.createElement('details'); box.className='area'; box.open=true;
    const nl=Object.values(gs).reduce((t,l)=>t+l.length,0);
    box.innerHTML=`<summary><input type="checkbox" checked id="ar-${ar.id}" aria-label="${ar.label}"><span>${ar.label}</span><span class="n">${nl} cam.</span></summary>`;
    const acb=box.querySelector('input');
    acb.addEventListener('click',e=>e.stopPropagation());
    const rows=[];
    for(const c of CATS){
      if(!gs[c.id])continue;
      const lab=document.createElement('label'); lab.className='cat';
      lab.innerHTML=`<input type="checkbox" checked><span class="sw" style="background:${c.color}"></span><span>${c.label}</span><span class="n">${gs[c.id].length} cam.</span>`;
      const cb=lab.querySelector('input'); rows.push([cb,gs[c.id]]);
      cb.addEventListener('change',()=>{gs[c.id].forEach(m=>m.visible=cb.checked);sync();});
      box.appendChild(lab);
    }
    function sync(){const on=rows.filter(r=>r[0].checked).length;acb.checked=on>0;acb.indeterminate=on>0&&on<rows.length;}
    acb.addEventListener('change',()=>{rows.forEach(([cb,ms])=>{cb.checked=acb.checked;ms.forEach(m=>m.visible=acb.checked);});acb.indeterminate=false;});
    areaCtl.push({acb,rows});
    el.appendChild(box);
  }
}
const areaCtl=[];
function setAll(v){for(const {acb,rows} of areaCtl){rows.forEach(([cb,ms])=>{cb.checked=v;ms.forEach(m=>m.visible=v);});acb.checked=v;acb.indeterminate=false;}}
document.getElementById('all').onclick=()=>setAll(true);
document.getElementById('none').onclick=()=>setAll(false);

// Views
let anim=null;
function setView(v,smooth=true){
  const vf=THREE.MathUtils.degToRad(camera.fov/2), hf=Math.atan(Math.tan(vf)*camera.aspect);
  const r=size.length()/2*0.72/Math.sin(Math.min(vf,hf));
  const dirs={iso:[1,0.75,1.1],top:[0,1,0.0001],front:[0,0.12,1],side:[1,0.12,0]};
  const d=new THREE.Vector3(...dirs[v]).normalize();
  const to=center.clone().addScaledVector(d,r), tgt=center.clone();
  if(!smooth||matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.copy(to);controls.target.copy(tgt);controls.update();return;}
  anim={p0:camera.position.clone(),t0:controls.target.clone(),p1:to,t1:tgt,s:performance.now()};
}
const vbtn=document.querySelectorAll('[data-view]');
vbtn.forEach(b=>b.onclick=()=>{vbtn.forEach(x=>x.classList.toggle('on',x===b));setView(b.dataset.view);});
vbtn[0].classList.add('on');

// Section cut
const cut=document.getElementById('cut'), cutv=document.getElementById('cutv');
cut.oninput=()=>{
  const f=cut.value/1000;
  if(f>=1){clip.constant=1e6;cutv.textContent='sem corte';return;}
  const y=box.min.y+f*size.y; clip.constant=y;
  cutv.textContent=('+'+((y-box.min.y)).toFixed(2)+' m').replace('+-','-');
};

// Pick
const ray=new THREE.Raycaster(); const ptr=new THREE.Vector2(); let picked=null, down=null;
const info=document.getElementById('info');
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;
  const r=renderer.domElement.getBoundingClientRect();
  ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ptr,camera);
  const vis=[];scene.traverse(o=>{if(o.isMesh&&o.visible&&o.userData.cat)vis.push(o)});
  const hit=ray.intersectObjects(vis,false).find(h=>clip.constant>1e5||h.point.y<=clip.constant);
  if(picked){picked.material=mats[picked.userData.cat.id];picked=null;}
  if(hit){picked=hit.object;picked.material=hiMat;
    document.getElementById('infoName').textContent=picked.userData.layer;
    document.getElementById('infoCat').textContent=picked.userData.area.label+' · '+picked.userData.cat.label;info.hidden=false;}
  else info.hidden=true;
});

// Mobile panel
const panel=document.getElementById('panel'), tg=document.getElementById('toggle');
if(matchMedia('(max-width:700px)').matches)panel.classList.add('closed');
tg.onclick=()=>{const c=panel.classList.toggle('closed');tg.setAttribute('aria-expanded',String(!c));};

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
renderer.setAnimationLoop(()=>{
  if(anim){const k=Math.min(1,(performance.now()-anim.s)/700),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(anim.p0,anim.p1,e);controls.target.lerpVectors(anim.t0,anim.t1,e);if(k>=1)anim=null;}
  controls.update(); renderer.render(scene,camera);
});
</script>
</body>
